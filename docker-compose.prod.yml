# Production compose — requires .env with hosted service URLs
# Usage: docker compose -f docker-compose.prod.yml up -d
# Local dev: docker compose up -d  (default docker-compose.yml)
#
# IMAGE (CD / registry): set IMAGE=ghcr.io/<owner>/<repo>:<tag> so migrate/api/worker
# pull a pre-built image (no on-VPS rebuild). When IMAGE is unset, compose builds from
# the local Dockerfile via the build: blocks below. Do not rename to DASHNOTE_IMAGE.

services:
  migrate:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # No depends_on local db — DATABASE_URL comes from .env (hosted Postgres)

  api:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DEBUG: "false"
      # NO DATABASE_URL, REDIS_URL, QDRANT_URL overrides here — all from .env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq src.worker.main.WorkerSettings
    env_file: .env
    environment:
      DEBUG: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "80:80"
      # 443 + TLS certs — see 7P.5 runbook (Caddy/Certbot/Cloudflare)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Optional metrics — enable with: docker compose -f docker-compose.prod.yml --profile observability up -d
  # No grafana on VPS — use Grafana Cloud remote_write
  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v2.51.2
    env_file: .env
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    restart: unless-stopped

volumes:
  prometheus_data:
