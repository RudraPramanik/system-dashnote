# Docker embedded DNS. `resolve` re-looks up `api` so nginx does not
# keep a stale container IP after `docker compose up --build api`
# (that 502 HTML has no CORS headers, so the browser reports a CORS error).
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /ai/ {
        limit_req zone=api_per_ip burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        limit_req zone=api_per_ip burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
