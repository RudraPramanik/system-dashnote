# Thin CI (Slice 8X.1 / 7P.7) — pytest + docker build only.
# No deploy, no VPS secrets, no required live LLM/Qdrant keys.
# Parity: match Dockerfile (python:3.12-slim + libmagic1 + requirements/base.txt).
# Inventory: openspec/changes/add-thin-ci/inventory.md

name: ci

on:
  pull_request:
  push:
    branches:
      - stage
      - main
      - production

jobs:
  test:
    runs-on: ubuntu-latest
    # Inventory verdict: READY-without-services (sqlite + fakes)
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://dashuser:dashpass@127.0.0.1:5432/dashnotes
      JWT_SECRET: pytest-jwt-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Dockerfile apt parity)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          # Test-only extra (sqlite in-memory engines); not in Dockerfile base.txt
          pip install aiosqlite

      - name: Run pytest
        # Allowlist (inventory): sqlite+aiosqlite create_all fails on JSONB columns
        # (files.tags). Revisit when these suites use Postgres fixtures / PG service.
        run: >
          python -m pytest -q
          --ignore=tests/auth/test_auth_tokens_api.py
          --ignore=tests/notebooks/test_notebooks_api.py
          --ignore=tests/notes/test_notes_rbac_api.py
          --ignore=tests/pages/test_versioning.py

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build .
