services:
  db:
    image: postgres:16-alpine
    container_name: dashnotesystem-db
    environment:
      POSTGRES_DB: dashnotes
      POSTGRES_USER: dashuser
      POSTGRES_PASSWORD: dashpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashuser -d dashnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dashnotesystem-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: dashnotesystem-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dashuser:dashpass@db:5432/dashnotes
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashnotesystem-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dashuser:dashpass@db:5432/dashnotes
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DEBUG: "true"
      LOCAL_STORAGE_PATH: storage
    volumes:
      - local_storage:/app/storage
    ports:
      # Direct API (docs, OpenAPI) for local dev. Production-style traffic uses nginx on :80 only.
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command: python -m arq src.worker.main.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dashuser:dashpass@db:5432/dashnotes
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LOCAL_STORAGE_PATH: storage
    volumes:
      - local_storage:/app/storage
    depends_on:
      - db
      - redis
      - qdrant
    restart: unless-stopped
    # Scale independently: docker compose up --scale worker=3 -d

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # Dev only — for production set QDRANT_URL to Qdrant Cloud in .env

  # mem_limit is enforced by Docker Engine directly.
  # deploy.resources is only respected in Swarm mode and is not used here.
  prometheus:
    image: prom/prometheus:v2.51.2
    env_file: .env
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  local_storage:
