# Production compose — thin VPS compute + hosted data plane when possible.
# Usage: docker compose -f docker-compose.prod.yml up -d
# Local dev: docker compose up -d  (default docker-compose.yml)
#
# IMAGE (CD / registry): set IMAGE=ghcr.io/<owner>/<repo>:<tag> so migrate/api/worker
# pull a pre-built image (no on-VPS rebuild). When IMAGE is unset, compose builds from
# the local Dockerfile via the build: blocks below. Do not rename to DASHNOTE_IMAGE.
#
# Postgres: optional on-box recovery DB (profile `onbox-db`). Prefer hosted Supabase/Neon
# when available. Enable with COMPOSE_PROFILES=onbox-db or --profile onbox-db.
# When on-box: DATABASE_URL must use host `postgres` (service name) and match
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB below.

services:
  postgres:
    profiles: ["onbox-db"]
    image: postgres:16-alpine
    container_name: dashnote-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dashnotes}
    volumes:
      - dashnote_pgdata:/var/lib/postgresql/data
    # Not published — only reachable on the compose network
    expose:
      - "5432"
    mem_limit: 384m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # DATABASE_URL from .env (hosted or on-box postgres hostname)

  api:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DEBUG: "false"
      # NO DATABASE_URL, REDIS_URL, QDRANT_URL overrides here — all from .env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: ${IMAGE:-dashnote-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq src.worker.main.WorkerSettings
    env_file: .env
    environment:
      DEBUG: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # Optional metrics — enable with: docker compose -f docker-compose.prod.yml --profile observability up -d
  # No grafana on VPS — use Grafana Cloud remote_write
  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v2.51.2
    env_file: .env
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    restart: unless-stopped

volumes:
  prometheus_data:
  # External so a manually created recovery volume keeps data across compose adoption
  dashnote_pgdata:
    external: true
    name: dashnote_pgdata
